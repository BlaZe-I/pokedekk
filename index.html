<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedek</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <nav class="nav-bar">
        <h1>Pokedek</h1>
        <input type="search" id="searchInput" placeholder="Pokemon suchen...">
    </nav>

    <main>
        <div class="center">
            <div class="poke-pfad" id="allpokemon"></div>
        </div>

        <div class="button">
            <button class="button-press" id="loadMore">Lade mehr</button>
        </div>
    </main>

    <div id="loader" class="loader-overlay">
        <div class="loader-box">
            <div class="loader"></div>
            <p>Pokémon werden geladen...</p>
        </div>
    </div>

    <div class="pokemon-window" id="pokemonWindow">
        <div class="pokemon-window-content">
            <button class="close-button" id="closeButton">X</button>
            <div id="pokemonDetails"></div>
        </div>
    </div>

    <footer>

    </footer>
</body>

</html>
